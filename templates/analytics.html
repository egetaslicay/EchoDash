<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EchoDash - Analytics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.plotly.com/plotly-latest.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #2d3748;
    }

    /* Navbar */
    .navbar {
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      padding: 1rem 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .navbar-brand {
      font-weight: 800;
      font-size: 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-link {
      color: #2d3748 !important;
      font-weight: 600;
      padding: 8px 16px !important;
      margin: 0 4px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .nav-link:hover {
      background: rgba(102, 126, 234, 0.1);
    }

    .nav-link.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white !important;
    }

    .profile-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #667eea;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    /* Header */
    .dashboard-header {
      padding: 40px 0 30px;
      text-align: center;
    }

    .dashboard-title {
      color: white;
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 10px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .dashboard-subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 18px;
      font-weight: 400;
    }

    /* Chart Cards */
    .chart-card {
      background: white;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
      animation: fadeIn 0.6s ease-out;
    }

    .chart-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
      transition: all 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .chart-title {
      font-size: 20px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }

    .container-custom {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .dashboard-title {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid container-custom">
      <a class="navbar-brand" href="{{ url_for('dashboard') }}">
        <i class="fas fa-wave-square"></i> EchoDash
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('dashboard') }}">
              <i class="fas fa-home"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="{{ url_for('analytics') }}">
              <i class="fas fa-chart-line"></i> Analytics
            </a>
          </li>
        </ul>
        <div class="profile-section">
          {% if user_image %}
            <img src="{{ user_image }}" alt="Profile" class="profile-img">
          {% endif %}
          <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-danger">
            <i class="fas fa-sign-out-alt"></i> Logout
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <div class="dashboard-header">
    <div class="container-custom">
      <h1 class="dashboard-title">Music Analytics</h1>
      <p class="dashboard-subtitle">
        <i class="fas fa-chart-bar"></i> Data-Driven Insights into Your Listening Habits
      </p>
    </div>
  </div>

  <!-- Content -->
  <div class="container-custom pb-5">
    <!-- Row 1: Artists & Genres -->
    <div class="row">
      <div class="col-lg-6 mb-4">
        <div class="chart-card">
          <div id="top-artists-bar"></div>
        </div>
      </div>
      <div class="col-lg-6 mb-4">
        <div class="chart-card">
          <div id="genre-distribution"></div>
        </div>
      </div>
    </div>

    <!-- Row 2: Popularity Charts -->
    <div class="row">
      <div class="col-lg-6 mb-4">
        <div class="chart-card">
          <div id="artist-popularity"></div>
        </div>
      </div>
      <div class="col-lg-6 mb-4">
        <div class="chart-card">
          <div id="track-popularity"></div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Render Plotly charts
    const charts = {
      'top-artists-bar': {{ charts.top_artists_bar | safe }},
      'genre-distribution': {{ charts.genre_distribution | safe }},
      'artist-popularity': {{ charts.artist_popularity | safe }},
      'track-popularity': {{ charts.track_popularity | safe }}
    };

    // Render each chart
    for (const [id, data] of Object.entries(charts)) {
      const element = document.getElementById(id);
      if (!element) continue;

      try {
        if (data && (data.data || data.layout)) {
          Plotly.newPlot(id, data.data || [], data.layout || {}, {responsive: true});
        } else {
          element.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">No data available</div>';
        }
      } catch (error) {
        console.error(`Error rendering chart ${id}:`, error);
        element.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">Error loading chart</div>';
      }
    }
  </script>
</body>
</html>
