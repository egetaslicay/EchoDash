<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EchoDash - Your Music, Visualized</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.15;
      animation: float 20s infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-100px) rotate(180deg); }
    }

    .particle:nth-child(1) {
      width: 80px;
      height: 80px;
      background: #1DB954;
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }

    .particle:nth-child(2) {
      width: 60px;
      height: 60px;
      background: #1ed760;
      top: 60%;
      left: 80%;
      animation-delay: 5s;
    }

    .particle:nth-child(3) {
      width: 100px;
      height: 100px;
      background: #1aa34a;
      top: 80%;
      left: 20%;
      animation-delay: 10s;
    }

    /* Glassmorphism card */
    .login-container {
      position: relative;
      z-index: 10;
      max-width: 480px;
      width: 90%;
      padding: 50px 40px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      animation: slideUp 0.8s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .subtitle {
      font-size: 18px;
      color: #666;
      margin-bottom: 40px;
      font-weight: 400;
    }

    .feature-list {
      text-align: left;
      margin: 30px 0;
      padding: 0;
      list-style: none;
    }

    .feature-list li {
      font-size: 15px;
      color: #555;
      margin-bottom: 12px;
      padding-left: 30px;
      position: relative;
    }

    .feature-list li i {
      position: absolute;
      left: 0;
      top: 2px;
      color: #1DB954;
      font-size: 18px;
    }

    .btn-spotify {
      background: #1DB954;
      color: white;
      border: none;
      padding: 16px 40px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 50px;
      width: 100%;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(29, 185, 84, 0.3);
      text-decoration: none;
      display: inline-block;
    }

    .btn-spotify:hover {
      background: #1ed760;
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(29, 185, 84, 0.4);
      color: white;
    }

    .btn-spotify i {
      margin-right: 10px;
      font-size: 20px;
    }

    .footer-text {
      margin-top: 30px;
      font-size: 13px;
      color: #999;
    }

    .ml-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    /* Responsive */
    @media (max-width: 576px) {
      .login-container {
        padding: 40px 30px;
      }

      .logo {
        font-size: 36px;
      }

      .subtitle {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Animated particles -->
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <div class="login-container">
    <div class="ml-badge">
      <i class="fas fa-robot"></i> ML-Powered Recommendations
    </div>

    <h1 class="logo">EchoDash</h1>
    <p class="subtitle">Your Music, Visualized</p>

    <ul class="feature-list">
      <li><i class="fas fa-music"></i> Track your top songs & artists</li>
      <li><i class="fas fa-brain"></i> AI-powered music recommendations</li>
      <li><i class="fas fa-chart-line"></i> Analyze your listening patterns</li>
      <li><i class="fas fa-sparkles"></i> Discover new music you'll love</li>
    </ul>

    <a href="{{ url_for('login') }}" class="btn-spotify">
      <i class="fab fa-spotify"></i>
      Continue with Spotify
    </a>

    <p class="footer-text">
      <i class="fas fa-lock"></i> Secure OAuth authentication
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
