<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EchoDash - Your Music, Visualized</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(ellipse at top right, rgba(240, 147, 251, 0.25) 0%, transparent 55%),
        radial-gradient(ellipse at bottom left, rgba(79, 172, 254, 0.2) 0%, transparent 55%),
        linear-gradient(135deg, #5a4fcf 0%, #764ba2 50%, #6b48c8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: float 20s infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      33% { transform: translateY(-60px) rotate(120deg) scale(1.1); }
      66% { transform: translateY(-100px) rotate(240deg) scale(0.9); }
    }

    .particle:nth-child(1) {
      width: 80px; height: 80px;
      background: radial-gradient(circle, rgba(29,185,84,0.4), rgba(29,185,84,0.05));
      top: 8%; left: 8%;
      animation-delay: 0s;
    }
    .particle:nth-child(2) {
      width: 55px; height: 55px;
      background: radial-gradient(circle, rgba(30,215,96,0.35), rgba(30,215,96,0.05));
      top: 55%; left: 82%;
      animation-delay: 5s;
    }
    .particle:nth-child(3) {
      width: 110px; height: 110px;
      background: radial-gradient(circle, rgba(26,163,74,0.3), rgba(26,163,74,0.03));
      top: 78%; left: 15%;
      animation-delay: 10s;
    }
    .particle:nth-child(4) {
      width: 40px; height: 40px;
      background: radial-gradient(circle, rgba(240,147,251,0.5), rgba(240,147,251,0.05));
      top: 20%; left: 75%;
      animation-delay: 3s; animation-duration: 15s;
    }
    .particle:nth-child(5) {
      width: 65px; height: 65px;
      background: radial-gradient(circle, rgba(79,172,254,0.4), rgba(79,172,254,0.05));
      top: 70%; left: 60%;
      animation-delay: 7s; animation-duration: 25s;
    }
    .particle:nth-child(6) {
      width: 30px; height: 30px;
      background: radial-gradient(circle, rgba(255,255,255,0.3), rgba(255,255,255,0.03));
      top: 40%; left: 5%;
      animation-delay: 12s; animation-duration: 18s;
    }
    .particle:nth-child(7) {
      width: 90px; height: 90px;
      background: radial-gradient(circle, rgba(102,126,234,0.25), rgba(102,126,234,0.03));
      top: 5%; left: 45%;
      animation-delay: 2s; animation-duration: 22s;
    }
    .particle:nth-child(8) {
      width: 50px; height: 50px;
      background: radial-gradient(circle, rgba(245,87,108,0.35), rgba(245,87,108,0.05));
      top: 85%; left: 75%;
      animation-delay: 8s; animation-duration: 16s;
    }

    /* Glassmorphism card */
    .login-container {
      position: relative;
      z-index: 10;
      max-width: 480px;
      width: 90%;
      padding: 50px 44px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.28),
        0 0 0 1px rgba(255,255,255,0.15) inset;
      text-align: center;
      animation: slideUp 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    /* Gradient top accent bar */
    .login-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, #1DB954, #667eea, #f093fb, #f5576c);
      border-radius: 32px 32px 0 0;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Equalizer bars */
    .eq-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 5px;
      height: 44px;
      margin-bottom: 20px;
    }

    .eq-bar {
      width: 7px;
      border-radius: 4px 4px 0 0;
      background: linear-gradient(to top, #667eea, #f093fb);
      animation: equalizer 1.4s ease-in-out infinite;
      transform-origin: bottom;
    }

    .eq-bar:nth-child(1) { height: 16px; animation-delay: 0.0s; }
    .eq-bar:nth-child(2) { height: 28px; animation-delay: 0.2s; }
    .eq-bar:nth-child(3) { height: 40px; animation-delay: 0.1s; }
    .eq-bar:nth-child(4) { height: 32px; animation-delay: 0.3s; }
    .eq-bar:nth-child(5) { height: 22px; animation-delay: 0.15s; }
    .eq-bar:nth-child(6) { height: 36px; animation-delay: 0.25s; }
    .eq-bar:nth-child(7) { height: 18px; animation-delay: 0.05s; }

    @keyframes equalizer {
      0%, 100% { transform: scaleY(0.35); opacity: 0.6; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    .logo {
      font-size: 46px;
      font-weight: 800;
      background: linear-gradient(135deg, #5a4fcf 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -1.5px;
      line-height: 1.1;
    }

    .subtitle {
      font-size: 17px;
      color: #6b7280;
      margin-bottom: 36px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .feature-list {
      text-align: left;
      margin: 28px 0;
      padding: 0;
      list-style: none;
    }

    .feature-list li {
      font-size: 15px;
      color: #4b5563;
      margin-bottom: 14px;
      padding: 12px 16px 12px 46px;
      position: relative;
      background: #f9fafb;
      border-radius: 12px;
      border: 1px solid #f0f0f0;
      transition: all 0.2s ease;
    }

    .feature-list li:hover {
      background: #f0f4ff;
      border-color: rgba(102, 126, 234, 0.2);
      transform: translateX(4px);
    }

    .feature-list li i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #667eea;
      font-size: 17px;
    }

    .btn-spotify {
      background: linear-gradient(135deg, #1DB954, #17a745);
      color: white;
      border: none;
      padding: 16px 40px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 50px;
      width: 100%;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 25px rgba(29, 185, 84, 0.35);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.3px;
    }

    .btn-spotify:hover {
      background: linear-gradient(135deg, #1ed760, #1DB954);
      transform: translateY(-3px);
      box-shadow: 0 14px 35px rgba(29, 185, 84, 0.45);
      color: white;
    }

    .btn-spotify i {
      font-size: 20px;
    }

    .footer-text {
      margin-top: 28px;
      font-size: 13px;
      color: #9ca3af;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .ml-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      padding: 7px 18px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(240, 93, 108, 0.3);
    }

    /* Responsive */
    @media (max-width: 576px) {
      .login-container { padding: 40px 28px; }
      .logo { font-size: 36px; }
      .subtitle { font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- Animated particles -->
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <div class="login-container">

    <!-- Equalizer Animation -->
    <div class="eq-container">
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
    </div>

    <div class="ml-badge">
      <i class="fas fa-robot"></i> ML-Powered Recommendations
    </div>

    <h1 class="logo">EchoDash</h1>
    <p class="subtitle">Your Music, Visualized</p>

    <ul class="feature-list">
      <li><i class="fas fa-music"></i> Track your top songs &amp; artists</li>
      <li><i class="fas fa-brain"></i> AI-powered music recommendations</li>
      <li><i class="fas fa-chart-line"></i> Analyze your listening patterns</li>
      <li><i class="fas fa-sparkles"></i> Discover new music you'll love</li>
    </ul>

    <a href="{{ url_for('login') }}" class="btn-spotify">
      <i class="fab fa-spotify"></i>
      Continue with Spotify
    </a>

    <p class="footer-text">
      <i class="fas fa-lock"></i> Secure OAuth 2.0 authentication
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
